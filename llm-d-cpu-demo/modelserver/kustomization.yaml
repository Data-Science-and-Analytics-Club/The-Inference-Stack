apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../recipes/modelserver/base/single-host/default
namePrefix: llm-d-cpu-demo-
components:
  - ../../../../recipes/modelserver/components/images/cpu-vllm/release
  - ../../../../recipes/modelserver/components/graceful-shutdown
labels:
  - pairs:
      llm-d.ai/guide: optimized-baseline
      llm-d.ai/model: Qwen2.5-0.5B-Instruct
      llm-d.ai/accelerator-variant: cpu
      llm-d.ai/accelerator-vendor: intel
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-small-cpu.yaml
